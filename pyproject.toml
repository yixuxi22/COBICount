[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobicount"
version = "0.1.0"
description = "Candidate-Origin Bias Isolation for source-only remote sensing object counting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Junjing Zheng"},
  {name = "Zhiyi Zhou"},
]
keywords = [
  "remote-sensing",
  "object-counting",
  "domain-generalization",
  "source-only",
  "pytorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=9.5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.scripts]
cobicount-train = "cobicount.cli.train:main"
cobicount-evaluate = "cobicount.cli.evaluate:main"
cobicount-infer = "cobicount.cli.infer:main"

[project.urls]
Homepage = "https://github.com/yixuxi22/COBICount"
Repository = "https://github.com/yixuxi22/COBICount"
Issues = "https://github.com/yixuxi22/COBICount/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
